name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  release-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install -q volatility3==2.28.2 pytest
      - run: sample/fetch.sh
        env:
          GH_TOKEN: ${{ github.token }}
      # without the sample the memory tests skip; here a skip is a failure
      - run: |
          set -o pipefail
          .venv/bin/pytest tests -rs | tee out.txt
          KVER=6.12.115+deb13.1-cloud-amd64 KEYRING_WORK=$PWD/sample/work-6.12 .venv/bin/pytest tests -rs | tee -a out.txt
          KVER=5.10.0-32-cloud-amd64 KEYRING_WORK=$PWD/sample/work-5.10 .venv/bin/pytest tests -rs | tee -a out.txt
          ! grep -q skipped out.txt
